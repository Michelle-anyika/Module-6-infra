AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Module 6 - image registry and CI identity. ECR repository (scan on push,
  lifecycle policy), pipeline artifact bucket, and an IAM role GitHub Actions
  assumes via OIDC (no long-lived keys) to push images and deploy bundles.

Parameters:
  ProjectName:
    Type: String
    Default: module-6
  Environment:
    Type: String
    Default: dev
  GitHubOrg:
    Type: String
    Default: Michelle-anyika
  GitHubAppRepo:
    Type: String
    Default: Module-6-app
  GitHubBranch:
    Type: String
    Default: main
  GitHubOwnerId:
    Type: String
    Default: '193885820'
    Description: Numeric GitHub owner ID (immutable OIDC subject claim)
  GitHubAppRepoId:
    Type: String
    Default: '1405703213'
    Description: Numeric GitHub repository ID (immutable OIDC subject claim)
  GitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: Existing token.actions.githubusercontent.com provider ARN. Leave empty to create one.

Conditions:
  CreateOidcProvider: !Equals [!Ref GitHubOidcProviderArn, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ProjectName}-${Environment}-app'
      ImageTagMutability: MUTABLE  # 'latest' moves; every image is also tagged with its commit SHA
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the 10 most recent images",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
              "action": { "type": "expire" }
            }]
          }

  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${Environment}-artifacts-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: { Status: Enabled }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 14 }

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition: { Bool: { 'aws:SecureTransport': 'false' } }

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-github-actions'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateOidcProvider, !Ref GitHubOidcProvider, !Ref GitHubOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # GitHub issues immutable subjects (owner@id/repo@id) for this repo; the
                # numeric IDs stop a deleted-and-recreated repo with the same name from
                # assuming the role. The legacy name-only form is kept for compatibility.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubAppRepo}@${GitHubAppRepoId}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubOrg}/${GitHubAppRepo}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: ecr-push-and-deploy-bundle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${ArtifactBucket.Arn}/deploy/*'

Outputs:
  EcrRepositoryName:
    Value: !Ref EcrRepository
    Export: { Name: !Sub '${AWS::StackName}-EcrRepositoryName' }
  EcrRepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
    Export: { Name: !Sub '${AWS::StackName}-EcrRepositoryUri' }
  EcrRepositoryArn:
    Value: !GetAtt EcrRepository.Arn
    Export: { Name: !Sub '${AWS::StackName}-EcrRepositoryArn' }
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export: { Name: !Sub '${AWS::StackName}-ArtifactBucketName' }
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
    Export: { Name: !Sub '${AWS::StackName}-ArtifactBucketArn' }
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
